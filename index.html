<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClauLIA Finanzas V2 - Pro</title>
    
    <!-- 📱 PWA CONFIGURACIÓN -->
    <link rel="manifest" href="/claulia-finanzas/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/claulia-finanzas/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/claulia-finanzas/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/claulia-finanzas/favicon-16x16.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ClauLIA">
    <meta name="theme-color" content="#e8a020">
    <meta name="description" content="Gestión financiera personal con sincronización en tiempo real">

    <style>
        :root {
            --bg: #f4f4f9; --text: #333; --accent: #e8a020;
            --card: #ffffff; --line: #ddd; --green: #27ae60; --red: #c0392b;
        }
        body.dark {
            --bg: #0d0d1a; --text: #e8e4da; --accent: #e8a020;
            --card: #1a1a2e; --line: #2e2e42; --green: #4ade80; --red: #f87171;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Navbar & Modo */
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-btn { cursor: pointer; font-size: 1.2rem; background: none; border: none; color: var(--accent); }

        /* Cuentas */
        .account-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; }
        .acct-btn { padding: 10px 18px; border: 1px solid var(--line); border-radius: 25px; background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 600; }
        .acct-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .summary { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--line); }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .kpi-val { font-size: 1.1rem; font-weight: bold; font-family: monospace; }

        /* Formulario */
        .form-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; min-width: 130px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--green); color: white; flex: 2; }
        .btn-import { background: var(--accent); color: white; text-align: center; cursor: pointer; flex: 1; }

        .table-wrap { background: var(--card); border-radius: 12px; overflow-x: auto; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
        th { background: rgba(0,0,0,0.05); font-size: 0.75rem; text-transform: uppercase; color: #888; cursor: pointer; }
        .tag-sub { font-size: 0.6rem; background: var(--accent); color: #000; padding: 2px 5px; border-radius: 4px; margin-right: 5px; font-weight: bold; }
    </style>
</head>
<body class="dark">

<div class="container">
    <div class="nav">
        <h2 style="margin:0;">ClauLIA <span style="color:var(--accent)">Finanzas</span></h2>
        <button class="theme-btn" onclick="toggleTheme()">🌓 Modo</button>
    </div>

    <div class="account-bar" id="account-bar"></div>
    
    <div style="margin-bottom: 15px; display:flex; gap:10px;">
        <button class="btn" style="background:var(--line); color:var(--text);" onclick="addAccount()">+ Nueva Categoría</button>
        <button class="btn" style="background:#fcc; color:red; display:none;" id="btn-del" onclick="deleteAccount()">Eliminar Cuenta</button>
    </div>

    <div class="summary" id="summary-view" style="display:none">
        <small style="color:#888;">SALDO TOTAL EN CUENTA</small><br>
        <span id="saldo-total" style="font-size:2rem; font-weight:bold;">$0.00</span>
        <div class="kpi-grid">
            <div><small>INGRESOS</small><br><span id="kpi-ing" class="kpi-val" style="color:var(--green)">$0</span></div>
            <div><small>EGRESOS</small><br><span id="kpi-egr" class="kpi-val" style="color:var(--red)">$0</span></div>
            <div><small>NETO</small><br><span id="kpi-neto" class="kpi-val"></span></div>
        </div>
    </div>

    <div class="form-box">
        <input type="date" id="f-fecha">
        <input type="text" id="f-nota" placeholder="Concepto">
        <input type="number" id="f-monto" step="0.01" placeholder="Importe">
        <input type="hidden" id="edit-id">
        <button class="btn btn-save" onclick="save()">Guardar</button>
        <label class="btn btn-import">
            📂 CSV <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        </label>
    </div>

    <div class="table-wrap" id="table-section" style="display:none">
        <table>
            <thead>
                <tr>
                    <th onclick="toggleSort()">Fecha ↕</th>
                    <th>Subcuenta / Concepto</th>
                    <th style="text-align:right">Monto</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="ledger"></tbody>
        </table>
    </div>
</div>

<script type="module">
    // 🚀 === 1. CONFIGURACIÓN SUPABASE (¡EDITA ESTO!) ===
    const SUPABASE_URL = 'https://ufulbzjgzidcnmnfnhau.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_iCW8Eh0uCS9ssnpZ0GEiyA_J99pTMv_';
    const USER_ID = 'claulia_user_unico'; // ID único para separar datos
    
    // 📱 Detección de iPhone para prioridad
    const IS_IPHONE = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const DEVICE_PRIORITY = IS_IPHONE ? 10 : 1;

    // Importar SDK desde CDN
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // === VARIABLES GLOBALES ===
    let db = {};
    let active = null;
    let sortDesc = true;
    let lastSyncTime = 0;
    let isSyncing = false;
    let pendingChanges = [];

    // === INICIALIZACIÓN ===
    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('f-fecha').valueAsDate = new Date();
        await initApp();
    });

    async function initApp() {
        // 1. Cargar datos
        const success = await loadFromCloud();
        
        // 2. Activar escucha en tiempo real
        if (success) subscribeToRealtime();
        
        // 3. Intentar migrar datos antiguos si la nube estaba vacía
        if (success && Object.keys(db).length === 0) {
            await migrateFromLocalStorage();
        }

        // 4. Renderizar vista
        renderAccounts();
        if(active) renderLedger();

        // 5. Enviar cambios pendientes si hay internet
        window.addEventListener('online', () => syncPendingQueue());
    }

    // === FUNCIONES DE SINCRONIZACIÓN ===
    
    async function loadFromCloud() {
        try {
            const { data, error } = await supabase
                .from('movimientos')
                .select('*')
                .eq('user_id', USER_ID)
                .order('updated_at', { ascending: false });

            if (error) throw error;

            // Reconstruir objeto DB local
            db = {};
            data.forEach(row => {
                if (!db[row.account]) db[row.account] = { movimientos: [] };
                db[row.account].movimientos.push({
                    id: row.id,
                    fecha: row.fecha,
                    concepto: row.concepto,
                    importe: row.importe,
                    subcuenta: row.subcuenta,
                    _ts: row.updated_at
                });
            });
            lastSyncTime = Date.now();
            console.log('✅ Datos cargados desde la nube');
            return true;
        } catch (e) {
            console.warn('⚠️ Error cargando nube (posible falta de conexión o config):', e);
            // Fallback a local
            db = JSON.parse(localStorage.getItem('clau_lia_v2_pro')) || {};
            return false;
        }
    }

    async function pushToCloud(movimiento, account, action, isPriority = false) {
        const payload = {
            user_id: USER_ID,
            account: account,
            fecha: movimiento.fecha,
            concepto: movimiento.concepto,
            importe: movimiento.importe,
            subcuenta: movimiento.subcuenta || null,
            updated_at: new Date().toISOString(),
            priority: isPriority ? DEVICE_PRIORITY : 1,
            device: IS_IPHONE ? 'iphone' : 'desktop'
        };

        try {
            if (action === 'insert') {
                const { data, error } = await supabase.from('movimientos').insert(payload).select();
                if (error) throw error;
                movimiento.id = data[0].id; // Actualizar ID local
            } else if (action === 'update') {
                await supabase.from('movimientos').update(payload).eq('id', movimiento.id);
            } else if (action === 'delete') {
                await supabase.from('movimientos').delete().eq('id', movimiento.id);
            }
            
            // Guardar copia local de seguridad
            localStorage.setItem('clau_lia_v2_pro', JSON.stringify(db));
        } catch (e) {
            console.warn('⚠️ Falló sync, encolando...', e);
            pendingChanges.push({ movimiento, account, action, isPriority, ts: Date.now() });
            localStorage.setItem('clau_lia_v2_pro', JSON.stringify(db));
        }
    }

    function subscribeToRealtime() {
        supabase.channel('claulia_sync')
            .on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'movimientos',
                filter: `user_id=eq.${USER_ID}`
            }, async payload => {
                // Lógica de prioridad: Si el cambio es de iPhone o es más nuevo que mi última carga
                const changePriority = payload.new?.priority || 0;
                const changeTime = new Date(payload.new?.updated_at).getTime();
                
                if (changePriority >= DEVICE_PRIORITY || changeTime > lastSyncTime) {
                    console.log('🔄 Sync forzado por cambio prioritario');
                    await loadFromCloud();
                    renderAccounts();
                    if(active) renderLedger();
                }
            })
            .subscribe();
    }

    async function syncPendingQueue() {
        if (isSyncing || pendingChanges.length === 0) return;
        isSyncing = true;
        // Procesar cambios pendientes
        for (const item of pendingChanges) {
            await pushToCloud(item.movimiento, item.account, item.action, item.isPriority);
        }
        pendingChanges = [];
        isSyncing = false;
        await loadFromCloud(); // Refrescar vista final
        renderAccounts();
        if(active) renderLedger();
    }

    // === MIGRACIÓN DE DATOS ANTIGUOS ===
    async function migrateFromLocalStorage() {
        const localData = JSON.parse(localStorage.getItem('clau_lia_v2_pro'));
        if (!localData) return;

        console.log('🔄 Migrando datos locales a la nube...');
        let count = 0;

        for (const [accName, accData] of Object.entries(localData)) {
            for (const mov of accData.movimientos) {
                await supabase.from('movimientos').insert({
                    user_id: USER_ID,
                    account: accName,
                    fecha: mov.fecha,
                    concepto: mov.concepto,
                    importe: mov.importe,
                    subcuenta: mov.subcuenta,
                    updated_at: new Date().toISOString(),
                    priority: 1,
                    device: 'migration'
                });
                count++;
            }
        }
        console.log(`✅ Migrados ${count} movimientos.`);
        await loadFromCloud(); // Recargar con datos nuevos
        renderAccounts();
        if(active) renderLedger();
    }

    // === FUNCIONES DE LA APP (UI) ===

    window.toggleTheme = function() { document.body.classList.toggle('dark'); }

    window.sync = function() {
        localStorage.setItem('clau_lia_v2_pro', JSON.stringify(db));
        renderAccounts();
        if(active) renderLedger();
    }

    function renderAccounts() {
        const bar = document.getElementById('account-bar');
        bar.innerHTML = '';
        Object.keys(db).forEach(name => {
            const saldo = db[name].movimientos.reduce((a, b) => a + Number(b.importe), 0);
            const btn = document.createElement('button');
            btn.className = `acct-btn ${active === name ? 'active' : ''}`;
            btn.innerText = `${name} ($${saldo.toFixed(0)})`;
            btn.onclick = () => { active = name; sync(); };
            bar.appendChild(btn);
        });
    }

    function renderLedger() {
        document.getElementById('summary-view').style.display = 'block';
        document.getElementById('table-section').style.display = 'block';
        document.getElementById('btn-del').style.display = 'inline-block';
        
        const body = document.getElementById('ledger');
        body.innerHTML = '';
        
        if (!db[active]) return;

        const movs = [...db[active].movimientos];
        let ing = 0, egr = 0;
        
        movs.forEach(m => { if(m.importe > 0) ing += m.importe; else egr += m.importe; });
        const saldo = ing + egr;

        document.getElementById('saldo-total').innerText = `$${saldo.toLocaleString(undefined, {minimumFractionDigits:2})}`;
        document.getElementById('kpi-ing').innerText = `+$${ing.toLocaleString()}`;
        document.getElementById('kpi-egr').innerText = `-$${Math.abs(egr).toLocaleString()}`;
        document.getElementById('kpi-neto').innerText = `$${saldo.toLocaleString()}`;

        movs.sort((a,b) => sortDesc ? new Date(b.fecha) - new Date(a.fecha) : new Date(a.fecha) - new Date(b.fecha));

        movs.forEach((m) => {
            const tag = m.subcuenta ? `<span class="tag-sub">${m.subcuenta}</span>` : '';
            body.innerHTML += `<tr>
                <td style="color:#888; font-size:0.8rem">${m.fecha}</td>
                <td style="font-weight:600">${tag}${m.concepto}</td>
                <td style="text-align:right; color:${m.importe >= 0 ? 'var(--green)':'var(--red)'}; font-family:monospace">
                    $${m.importe.toLocaleString(undefined, {minimumFractionDigits:2})}
                </td>
                <td onclick="window.edit('${m.id}')" style="cursor:pointer">✏️</td>
            </tr>`;
        });
    }

    window.importCSV = async function(e) {
        if(!active) return alert("Crea y selecciona una categoría primero.");
        const file = e.target.files[0];
        const subName = file.name.replace('.csv', '').substring(0, 8);
        const reader = new FileReader();
        
        reader.onload = async (ev) => {
            const content = ev.target.result.replace(/^\ufeff/, "").replace(/\r/g, "");
            const lines = content.split("\n").filter(l => l.trim() !== "");
            const headers = lines[0].toLowerCase().split(",").map(h => h.trim());
            
            const iF = headers.findIndex(h => h.includes("date") || h.includes("fecha"));
            const iN = headers.findIndex(h => h.includes("note") || h.includes("concepto"));
            const iInc = headers.findIndex(h => h.includes("income") || h.includes("ingreso") || h.includes("abono"));
            const iExp = headers.findIndex(h => h.includes("expense") || h.includes("egreso") || h.includes("retiro"));
            const iImp = headers.findIndex(h => h.includes("amount") || h.includes("importe"));

            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if(!line.trim()) continue;
                const c = line.split(",").map(col => col.trim());
                let m = 0;
                if(iInc !== -1 || iExp !== -1) {
                    m = (parseFloat(c[iInc]) || 0) - (parseFloat(c[iExp]) || 0);
                } else {
                    m = parseFloat(c[iImp]) || 0;
                }

                if(!isNaN(m)) {
                    const newMov = {
                        id: 'temp_'+Date.now()+'_'+count,
                        fecha: c[iF] || new Date().toISOString().split('T')[0],
                        concepto: c[iN] || "Carga Masiva",
                        importe: m,
                        subcuenta: subName
                    };
                    
                    // Guardar local y subir a nube
                    db[active].movimientos.push(newMov);
                    await pushToCloud(newMov, active, 'insert', IS_IPHONE);
                    count++;
                }
            }
            sync();
            alert(`Importados ${count} movimientos`);
        };
        reader.readAsText(file);
    }

    window.save = async function() {
        const f = document.getElementById('f-fecha').value, 
              n = document.getElementById('f-nota').value, 
              m = parseFloat(document.getElementById('f-monto').value), 
              id = document.getElementById('edit-id').value;
        
        if(!f || !n || isNaN(m)) return alert("Datos incompletos");
        
        if(id) {
            const i = db[active].movimientos.findIndex(x => x.id === id);
            const updated = { id, fecha:f, concepto:n, importe:m, subcuenta: db[active].movimientos[i].subcuenta };
            db[active].movimientos[i] = updated;
            await pushToCloud(updated, active, 'update', IS_IPHONE);
        } else {
            const newMov = { id: 'temp_'+Date.now(), fecha:f, concepto:n, importe:m, subcuenta: 'Manual' };
            db[active].movimientos.push(newMov);
            await pushToCloud(newMov, active, 'insert', IS_IPHONE);
        }
        
        document.getElementById('f-nota').value = ''; 
        document.getElementById('f-monto').value = ''; 
        document.getElementById('edit-id').value = '';
        sync();
    }

    window.addAccount = function() {
        const n = prompt("Nombre de la categoría:");
        if(n && !db[n]) { 
            db[n] = { movimientos: [] }; 
            active = n; 
            sync(); 
        }
    }

    window.deleteAccount = async function() { 
        if(confirm("¿Borrar cuenta y todos sus movimientos?")) { 
            // Borrar en nube
            await supabase.from('movimientos').delete().eq('user_id', USER_ID).eq('account', active);
            
            delete db[active]; 
            active = null; 
            sync(); 
            location.reload(); 
        } 
    }

    window.edit = function(id) {
        const m = db[active].movimientos.find(x => x.id === id);
        document.getElementById('f-fecha').value = m.fecha; 
        document.getElementById('f-nota').value = m.concepto;
        document.getElementById('f-monto').value = m.importe; 
        document.getElementById('edit-id').value = m.id;
        window.scrollTo(0,0);
    }

    window.toggleSort = function() { 
        sortDesc = !sortDesc; 
        renderLedger(); 
    }
</script>
</body>
</html>
