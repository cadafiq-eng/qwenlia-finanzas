<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QwenLIA Finanzas</title>
    
    <!-- Favicon y configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e8a020">

    <style>
        :root {
            --bg: #f4f4f9; --text: #333; --accent: #e8a020;
            --card: #ffffff; --line: #ddd; --green: #27ae60; --red: #c0392b;
        }
        body.dark {
            --bg: #0d0d1a; --text: #e8e4da; --accent: #e8a020;
            --card: #1a1a2e; --line: #2e2e42; --green: #4ade80; --red: #f87171;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: 0.3s; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .theme-btn { cursor: pointer; font-size: 1.2rem; background: none; border: none; color: var(--accent); }

        .account-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 5px; }
        .sub-bar { display: none; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 15px; transition: all 0.2s ease; }
        .sub-bar.visible { display: flex; }
        .btn-toggle-sub { 
            background: var(--card); border: 1px solid var(--line); 
            padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; 
            cursor: pointer; color: var(--text); margin-bottom: 10px; 
            display: inline-flex; align-items: center; gap: 6px;
        }
        
        .acct-btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 0.9rem; display:flex; align-items:center; gap:6px; }
        .acct-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .rename-btn { font-size:0.8rem; opacity:0.7; margin-left:4px; cursor: pointer; }
        
        .sub-btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); color: var(--text); cursor: pointer; white-space: nowrap; font-size: 0.8rem; opacity: 0.8; display:flex; align-items:center; gap:4px; }
        .sub-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); opacity: 1; }

        .summary { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--line); }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .kpi-val { font-size: 1rem; font-weight: bold; font-family: monospace; }

        .form-box { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
        input { flex: 1; min-width: 130px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--green); color: white; flex: 2; }
        .btn-import { background: var(--accent); color: white; text-align: center; cursor: pointer; flex: 1; }
        .btn-export { background: #3498db; color: white; flex: 1; }

        .table-wrap { background: var(--card); border-radius: 12px; overflow-x: auto; border: 1px solid var(--line); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
        th { background: rgba(0,0,0,0.05); font-size: 0.75rem; text-transform: uppercase; color: #888; cursor: pointer; }
        .tag-sub { font-size: 0.7rem; background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; margin-right: 5px; font-weight: bold; }

        @media (max-width: 600px) {
            .sub-btn { padding: 5px 8px; font-size: 0.75rem; }
            .sub-bar::-webkit-scrollbar { display: none; }
            .btn-toggle-sub { font-size: 0.8rem; padding: 5px 10px; }
        }

        /* Auth UI */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; }
        #app-screen { display: none; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--line); max-width: 400px; width: 100%; }
        .auth-title { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
        .auth-input { width: 100%; margin-bottom: 15px; }
        .auth-btn { width: 100%; margin-bottom: 10px; }
        .auth-btn.secondary { background: var(--line); color: var(--text); }
        .logout-btn { background: var(--red); color: white; font-size: 0.8rem; padding: 5px 10px; }
    </style>
</head>
<body class="dark">

<!-- AUTH SCREEN -->
<div id="auth-screen">
    <div class="auth-card">
        <h2 class="auth-title">Qwen<span style="color:var(--accent)">LIA</span></h2>
        <p style="margin-bottom:20px; color:#888;">Control financiero inteligente</p>
        
        <div id="login-form">
            <input type="email" id="auth-email" class="auth-input" placeholder="Correo electrónico">
            <input type="password" id="auth-password" class="auth-input" placeholder="Contraseña">
            <button class="btn auth-btn" onclick="login()">Iniciar Sesión</button>
            <button class="btn auth-btn secondary" onclick="showSignup()">Crear Cuenta</button>
        </div>

        <div id="signup-form" style="display:none;">
            <input type="email" id="signup-email" class="auth-input" placeholder="Correo electrónico">
            <input type="password" id="signup-password" class="auth-input" placeholder="Contraseña (mín. 6 caracteres)">
            <button class="btn auth-btn" onclick="signup()">Registrarse</button>
            <button class="btn auth-btn secondary" onclick="showLogin()">Ya tengo cuenta</button>
        </div>
        <p id="auth-msg" style="color:var(--red); margin-top:10px; font-size:0.9rem;"></p>
    </div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" class="container">
    <div class="nav">
        <h2 style="margin:0;">Qwen<span style="color:var(--accent)">LIA</span></h2>
        <div style="display:flex; gap:10px; align-items:center;">
            <span id="user-email" style="font-size:0.8rem; color:#888;"></span>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </div>

    <div class="account-bar" id="account-bar"></div>
    <button class="btn-toggle-sub" onclick="toggleSubBar()">📂 Subcuentas <span id="sub-arrow">▼</span></button>
    <div class="sub-bar" id="sub-bar"></div>

    <div style="margin-bottom: 15px; display:flex; gap:10px;">
        <button class="btn" style="background:var(--line); color:var(--text);" onclick="addAccount()">+ Nueva Categoría</button>
        <button class="btn" style="background:#fcc; color:red; display:none;" id="btn-del" onclick="deleteAccount()">Eliminar Cuenta</button>
    </div>

    <div class="summary" id="summary-view" style="display:none">
        <small style="color:#888;" id="saldo-label">SALDO TOTAL EN CUENTA</small><br>
        <span id="saldo-total" style="font-size:2rem; font-weight:bold;">$0.00</span>
        <div class="kpi-grid">
            <div><small>INGRESOS</small><br><span id="kpi-ing" class="kpi-val" style="color:var(--green)">$0</span></div>
            <div><small>EGRESOS</small><br><span id="kpi-egr" class="kpi-val" style="color:var(--red)">$0</span></div>
            <div><small>NETO</small><br><span id="kpi-neto" class="kpi-val"></span></div>
        </div>
    </div>

    <div class="form-box">
        <input type="date" id="f-fecha">
        <input type="text" id="f-nota" placeholder="Concepto">
        <input type="number" id="f-monto" step="0.01" placeholder="Importe">
        <input type="hidden" id="edit-id">
        <button class="btn btn-save" onclick="save()">Guardar</button>
        <label class="btn btn-import">
            📂 CSV <input type="file" id="csv" style="display:none" onchange="importCSV(event)">
        </label>
        <button class="btn btn-export" id="btn-export" style="display:none;" onclick="exportToExcel()">📊 Excel</button>
    </div>

    <div class="table-wrap" id="table-section" style="display:none">
        <table>
            <thead>
                <tr>
                    <th onclick="toggleSort()">Fecha ↕</th>
                    <th>Subcuenta / Concepto</th>
                    <th style="text-align:right">Monto</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="ledger"></tbody>
        </table>
    </div>
</div>

<script type="module">
    // 🔑 CONFIGURACIÓN: Reemplaza con tus datos reales de Supabase
    const SUPABASE_URL = 'https://gbfqlappekttnypdilti.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZnFsYXBwZWt0dG55cGRpbHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1NjAyNzUsImV4cCI6MjA5MjEzNjI3NX0._L2jYcmnPPlXeIl9wHcUX45_onjxNUX0SbDJZcXenRQ';
    
    const IS_IPHONE = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const DEVICE_PRIORITY = IS_IPHONE ? 10 : 1;

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let db = {};
    let active = null;
    let activeSub = null;
    let sortDesc = true;
    let lastSyncTime = 0;
    let pendingChanges = [];
    let supabaseConnected = false;
    let currentUser = null;

    // === AUTH UI FUNCTIONS ===
    window.showSignup = () => { document.getElementById('login-form').style.display = 'none'; document.getElementById('signup-form').style.display = 'block'; document.getElementById('auth-msg').textContent = ''; }
    window.showLogin = () => { document.getElementById('login-form').style.display = 'block'; document.getElementById('signup-form').style.display = 'none'; document.getElementById('auth-msg').textContent = ''; }

    window.login = async () => {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        if (!email || !password) return showAuthMsg('Completa ambos campos');
        
        // ✅ CORRECCIÓN CLAVE:  { session }
        const { data: { session }, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return showAuthMsg(error.message);
        handleAuthSuccess(session.user);
    }

    window.signup = async () => {
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        if (!email || password.length < 6) return showAuthMsg('Contraseña mínima 6 caracteres');
        
        // ✅ CORRECCIÓN CLAVE:  { session }
        const { data: { session }, error } = await supabase.auth.signUp({ email, password });
        if (error) return showAuthMsg(error.message);
        showAuthMsg('✅ Cuenta creada. Revisa tu correo para confirmar.');
        setTimeout(() => showLogin(), 2000);
    }

    window.logout = async () => {
        await supabase.auth.signOut();
        currentUser = null; db = {}; active = null;
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
    }

    function showAuthMsg(msg) { document.getElementById('auth-msg').textContent = msg; }

    async function handleAuthSuccess(user) {
        currentUser = user;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        
        supabaseConnected = await loadFromCloud();
        if (supabaseConnected) subscribeToRealtime();
        else console.warn('⚠️ Modo offline');
        
        if (supabaseConnected && Object.keys(db).length === 0) await migrateFromLocalStorage();
        renderAccounts(); renderSubAccounts(); if (active) renderLedger();
        window.addEventListener('online', () => syncPendingQueue());
    }

    // Check session on load
    // ✅ CORRECCIÓN CLAVE:  { session }
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) handleAuthSuccess(session.user);
    });

    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session?.user) handleAuthSuccess(session.user);
        if (event === 'SIGNED_OUT') logout();
    });

    // === DATA FUNCTIONS ===
    async function loadFromCloud() {
        try {
            if (!currentUser) return false;
            const { data, error } = await supabase.from('movimientos').select('*').eq('user_id', currentUser.id).order('updated_at', { ascending: false });
            if (error) { console.warn('⚠️ Error cargando:', error.message); return false; }
            db = {};
            data.forEach(row => {
                if (!db[row.account]) db[row.account] = { movimientos: [] };
                db[row.account].movimientos.push({ id: row.id, fecha: row.fecha, concepto: row.concepto, importe: row.importe, subcuenta: row.subcuenta, _ts: row.updated_at });
            });
            lastSyncTime = Date.now();
            console.log('✅ Conectado a la nube');
            return true;
        } catch (e) {
            db = JSON.parse(localStorage.getItem('qwenlia_data')) || {};
            return false;
        }
    }

    async function pushToCloud(movimiento, account, action, isPriority = false) {
        if (!supabaseConnected || !currentUser) { localStorage.setItem('qwenlia_data', JSON.stringify(db)); return; }
        const payload = { user_id: currentUser.id, account, fecha: movimiento.fecha, concepto: movimiento.concepto, importe: movimiento.importe, subcuenta: movimiento.subcuenta || null, updated_at: new Date().toISOString(), priority: isPriority ? DEVICE_PRIORITY : 1, device: IS_IPHONE ? 'iphone' : 'desktop' };
        try {
            if (action === 'insert') { const { data, error } = await supabase.from('movimientos').insert(payload).select(); if (error) throw error; movimiento.id = data[0].id; }
            else if (action === 'update') await supabase.from('movimientos').update(payload).eq('id', movimiento.id);
            else if (action === 'delete') await supabase.from('movimientos').delete().eq('id', movimiento.id);
            localStorage.setItem('qwenlia_data', JSON.stringify(db));
        } catch (e) {
            console.warn('⚠️ Error sync, guardando local:', e.message);
            pendingChanges.push({ movimiento, account, action, isPriority, ts: Date.now() });
            localStorage.setItem('qwenlia_data', JSON.stringify(db));
        }
    }

    function subscribeToRealtime() {
        try {
            supabase.channel('qwenlia_sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'movimientos', filter: `user_id=eq.${currentUser.id}` }, async payload => {
                    if ((payload.new?.priority || 0) >= DEVICE_PRIORITY || new Date(payload.new?.updated_at).getTime() > lastSyncTime) {
                        await loadFromCloud(); renderAccounts(); renderSubAccounts(); if (active) renderLedger();
                    }
                })
                .subscribe(status => {
                    if (status !== 'SUBSCRIBED') {
                        console.warn('⚠️ Realtime fallback polling 30s');
                        setInterval(async () => { if (document.visibilityState === 'visible') { await loadFromCloud(); if (active) renderLedger(); } }, 30000);
                    }
                });
        } catch (e) { console.warn('⚠️ Error subscribiendo:', e.message); }
    }

    async function syncPendingQueue() {
        if (pendingChanges.length === 0 || !supabaseConnected) return;
        for (const item of pendingChanges) await pushToCloud(item.movimiento, item.account, item.action, item.isPriority);
        pendingChanges = []; await loadFromCloud(); renderAccounts(); renderSubAccounts(); if (active) renderLedger();
    }

    async function migrateFromLocalStorage() {
        const oldData = JSON.parse(localStorage.getItem('clau_lia_v2_pro')) || JSON.parse(localStorage.getItem('qwenlia_data'));
        if (!oldData || !supabaseConnected) return;
        console.log('🔄 Migrando...');
        for (const [acc, data] of Object.entries(oldData)) {
            for (const m of data.movimientos) {
                await supabase.from('movimientos').insert({ user_id: currentUser.id, account: acc, fecha: m.fecha, concepto: m.concepto, importe: m.importe, subcuenta: m.subcuenta, updated_at: new Date().toISOString(), priority: 1, device: 'migration' });
            }
        }
        await loadFromCloud(); renderAccounts(); renderSubAccounts(); if (active) renderLedger();
    }

    // === UI RENDERING ===
    window.toggleTheme = () => document.body.classList.toggle('dark');
    window.sync = () => { localStorage.setItem('qwenlia_data', JSON.stringify(db)); document.getElementById('btn-export').style.display = active ? 'inline-block' : 'none'; renderAccounts(); renderSubAccounts(); if (active) renderLedger(); }
    window.toggleSubBar = function() {
        const bar = document.getElementById('sub-bar');
        const arrow = document.getElementById('sub-arrow');
        bar.classList.toggle('visible');
        arrow.textContent = bar.classList.contains('visible') ? '▲' : '▼';
    }

    function renderAccounts() {
        const bar = document.getElementById('account-bar'); bar.innerHTML = '';
        Object.keys(db).forEach(name => {
            const saldo = db[name].movimientos.reduce((a, b) => a + Number(b.importe), 0);
            const btn = document.createElement('button');
            btn.className = `acct-btn ${active === name ? 'active' : ''}`;
            btn.innerHTML = `${name} ($${saldo.toFixed(0)}) <span class="rename-btn" onclick="event.stopPropagation(); renameAccount('${name}')">✏️</span>`;
            btn.onclick = () => { active = name; activeSub = null; sync(); };
            bar.appendChild(btn);
        });
    }

    function renderSubAccounts() {
        const bar = document.getElementById('sub-bar'); bar.innerHTML = '';
        if (!active || !db[active]) { bar.classList.remove('visible'); return; }
        const movs = db[active].movimientos;
        const subs = [...new Set(movs.map(m => m.subcuenta).filter(Boolean))];
        if (subs.length === 0) { bar.classList.remove('visible'); return; }
        bar.classList.add('visible');
        const allBtn = document.createElement('button');
        allBtn.className = `sub-btn ${activeSub === null ? 'active' : ''}`;
        allBtn.innerText = 'Todos';
        allBtn.onclick = () => { activeSub = null; renderSubAccounts(); renderLedger(); };
        bar.appendChild(allBtn);
        subs.forEach(sub => {
            const saldo = movs.filter(m => m.subcuenta === sub).reduce((a, b) => a + Number(b.importe), 0);
            const btn = document.createElement('button');
            btn.className = `sub-btn ${activeSub === sub ? 'active' : ''}`;
            btn.innerHTML = `${sub} ($${saldo.toFixed(0)}) <span class="rename-btn" onclick="event.stopPropagation(); renameSubaccount('${sub}')">✏️</span>`;
            btn.onclick = () => { activeSub = sub; renderSubAccounts(); renderLedger(); };
            bar.appendChild(btn);
        });
    }

    function renderLedger() {
        document.getElementById('summary-view').style.display = 'block';
        document.getElementById('table-section').style.display = 'block';
        document.getElementById('btn-del').style.display = 'inline-block';
        const body = document.getElementById('ledger'); body.innerHTML = '';
        if (!db[active]) return;
        let movs = [...db[active].movimientos];
        if (activeSub) { movs = movs.filter(m => m.subcuenta === activeSub); document.getElementById('saldo-label').innerText = `SALDO SUBCUENTA: ${activeSub}`; }
        else document.getElementById('saldo-label').innerText = 'SALDO TOTAL EN CUENTA';
        let ing = 0, egr = 0;
        movs.forEach(m => { if (m.importe > 0) ing += m.importe; else egr += m.importe; });
        document.getElementById('saldo-total').innerText = `$${(ing + egr).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
        document.getElementById('kpi-ing').innerText = `+$${ing.toLocaleString()}`;
        document.getElementById('kpi-egr').innerText = `-$${Math.abs(egr).toLocaleString()}`;
        document.getElementById('kpi-neto').innerText = `$${(ing + egr).toLocaleString()}`;
        movs.sort((a, b) => sortDesc ? new Date(b.fecha) - new Date(a.fecha) : new Date(a.fecha) - new Date(b.fecha));
        movs.forEach(m => {
            const tag = m.subcuenta ? `<span class="tag-sub">${m.subcuenta}</span>` : '';
            body.innerHTML += `<tr><td style="color:#888; font-size:0.8rem">${m.fecha}</td><td style="font-weight:600">${tag}${m.concepto}</td><td style="text-align:right; color:${m.importe >= 0 ? 'var(--green)' : 'var(--red)'}; font-family:monospace">$${m.importe.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td><td><span onclick="window.edit('${m.id}')" style="cursor:pointer;margin-right:8px">✏️</span><span onclick="window.deleteMovement('${m.id}')" style="cursor:pointer;color:var(--red)">🗑️</span></td></tr>`;
        });
    }

    // === CSV PARSER & IMPORT ===
    function parseCSVLine(text, separator) {
        const result = []; let current = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"') { inQuotes = !inQuotes; }
            else if (char === separator && !inQuotes) { result.push(current); current = ''; }
            else { current += char; }
        }
        result.push(current);
        return result.map(val => val.trim().replace(/^"|"$/g, ''));
    }

    window.importCSV = async function(e) {
        if (!active) return alert("Selecciona una categoría primero");
        const file = e.target.files[0];
        const subName = file.name.replace('.csv', '').substring(0, 8);
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const content = ev.target.result.replace(/^\ufeff/, "").replace(/\r/g, "");
            const lines = content.split("\n").filter(l => l.trim() !== "");
            if (lines.length < 2) return;
            const separator = lines[0].includes(';') ? ';' : ',';
            const headers = parseCSVLine(lines[0], separator).map(h => h.toLowerCase());
            const iF = headers.findIndex(h => h.includes("date") || h.includes("fecha"));
            const iN = headers.findIndex(h => h.includes("note") || h.includes("concepto") || h.includes("descripcion"));
            const iInc = headers.findIndex(h => h.includes("income") || h.includes("ingreso") || h.includes("abono"));
            const iExp = headers.findIndex(h => h.includes("expense") || h.includes("egreso") || h.includes("retiro"));
            let count = 0, skipped = 0;
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim(); if (!line) continue;
                const c = parseCSVLine(line, separator);
                if (!c[iF] || !c[iN]) { skipped++; continue; }
                let fechaRaw = c[iF], fecha = fechaRaw;
                if (fechaRaw.includes('/')) { const parts = fechaRaw.split('/'); if (parts.length === 3) fecha = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`; }
                else if (!fechaRaw.includes('-') && fechaRaw.length === 8) { fecha = `${fechaRaw.substring(0, 4)}-${fechaRaw.substring(4, 6)}-${fechaRaw.substring(6, 8)}`; }
                let m = 0;
                if (iInc !== -1 && iExp !== -1 && c[iInc] && c[iExp]) m = (parseFloat(c[iInc].replace(/[^0-9.-]/g, '')) || 0) - (parseFloat(c[iExp].replace(/[^0-9.-]/g, '')) || 0);
                if (!isNaN(m) && m !== 0) {
                    db[active].movimientos.push({ id: 'temp_' + Date.now() + '_' + i, fecha, concepto: c[iN] || "Carga CSV", importe: m, subcuenta: subName });
                    await pushToCloud(db[active].movimientos[db[active].movimientos.length - 1], active, 'insert', IS_IPHONE);
                    count++;
                } else { skipped++; }
            }
            renderSubAccounts(); sync();
            alert(`✅ Importados: ${count}\n⏭️ Saltadas: ${skipped}`);
        };
        reader.readAsText(file);
    }

    // === CRUD & UTILS ===
    window.save = async function() {
        if (!active) return alert("⚠️ Primero selecciona una categoría");
        if (!db[active]) db[active] = { movimientos: [] };
        const f = document.getElementById('f-fecha').value, n = document.getElementById('f-nota').value, m = parseFloat(document.getElementById('f-monto').value), id = document.getElementById('edit-id').value;
        if (!f || !n || isNaN(m)) return alert("Datos incompletos");
        const subVal = activeSub || (id && db[active].movimientos.find(x => x.id === id) ? db[active].movimientos.find(x => x.id === id).subcuenta : 'Manual');
        if (id) {
            const i = db[active].movimientos.findIndex(x => x.id === id);
            if (i === -1) return alert("Movimiento no encontrado");
            const updated = { id, fecha: f, concepto: n, importe: m, subcuenta: subVal };
            db[active].movimientos[i] = updated;
            await pushToCloud(updated, active, 'update', IS_IPHONE);
        } else {
            const newMov = { id: 'temp_' + Date.now(), fecha: f, concepto: n, importe: m, subcuenta: subVal };
            db[active].movimientos.push(newMov);
            await pushToCloud(newMov, active, 'insert', IS_IPHONE);
        }
        document.getElementById('f-nota').value = ''; document.getElementById('f-monto').value = ''; document.getElementById('edit-id').value = '';
        sync();
    }

    window.addAccount = function() { const n = prompt("Nombre:"); if (n && !db[n]) { db[n] = { movimientos: [] }; active = n; activeSub = null; sync(); } }
    window.deleteAccount = async function() { 
        if(confirm("¿Eliminar cuenta y todos sus movimientos?")) { 
            if(supabaseConnected && currentUser) await supabase.from('movimientos').delete().eq('user_id', currentUser.id).eq('account', active);
            delete db[active]; active = null; activeSub = null; sync(); location.reload(); 
        } 
    }
    window.deleteMovement = async function(id) {
        if (!confirm("¿Eliminar este movimiento?")) return;
        if (!active || !db[active]) return;
        const index = db[active].movimientos.findIndex(m => m.id === id);
        if (index === -1) return;
        if (supabaseConnected && currentUser) await supabase.from('movimientos').delete().eq('id', id);
        db[active].movimientos.splice(index, 1);
        sync();
    }
    window.edit = function(id) {
        if (!active || !db[active]) return;
        const m = db[active].movimientos.find(x => x.id === id); if (!m) return;
        document.getElementById('f-fecha').value = m.fecha; document.getElementById('f-nota').value = m.concepto;
        document.getElementById('f-monto').value = m.importe; document.getElementById('edit-id').value = m.id;
        window.scrollTo(0, 0);
    }
    window.toggleSort = function() { sortDesc = !sortDesc; renderLedger(); }
    window.renameAccount = async function(oldName) {
        if (!db[oldName]) return;
        const newName = prompt("Nuevo nombre para la cuenta:", oldName);
        if (!newName || newName === oldName || db[newName]) return alert("Nombre inválido o ya existe.");
        db[newName] = db[oldName]; delete db[oldName];
        if(supabaseConnected && currentUser) await supabase.from('movimientos').update({ account: newName }).eq('user_id', currentUser.id).eq('account', oldName);
        if (active === oldName) active = newName;
        activeSub = null; sync();
    }
    window.renameSubaccount = async function(oldSub) {
        if (!active || !db[active]) return;
        const newSub = prompt("Nuevo nombre para la subcuenta:", oldSub);
        if (!newSub || newSub === oldSub) return;
        db[active].movimientos.forEach(m => { if (m.subcuenta === oldSub) m.subcuenta = newSub; });
        if(supabaseConnected && currentUser) await supabase.from('movimientos').update({ subcuenta: newSub }).eq('user_id', currentUser.id).eq('account', active).eq('subcuenta', oldSub);
        renderSubAccounts(); renderLedger();
        localStorage.setItem('qwenlia_data', JSON.stringify(db));
    }

    // === EXPORT TO EXCEL ===
    window.exportToExcel = function() {
        if (!active || !db[active]) return alert("Selecciona una cuenta primero");
        let data = db[active].movimientos;
        if (activeSub) data = data.filter(m => m.subcuenta === activeSub);
        if (data.length === 0) return alert("No hay datos para exportar");
        data.sort((a,b) => sortDesc ? new Date(b.fecha) - new Date(a.fecha) : new Date(a.fecha) - new Date(b.fecha));
        let csv = "Fecha;Concepto;Importe;Subcuenta\n";
        data.forEach(m => {
            const concepto = `"${(m.concepto || '').replace(/"/g, '""')}"`;
            const subcuenta = `"${(m.subcuenta || '').replace(/"/g, '""')}"`;
            csv += `${m.fecha};${concepto};${m.importe};${subcuenta}\n`;
        });
        const total = data.reduce((sum, m) => sum + m.importe, 0);
        const ingresos = data.filter(m => m.importe > 0).reduce((sum, m) => sum + m.importe, 0);
        const egresos = Math.abs(data.filter(m => m.importe < 0).reduce((sum, m) => sum + m.importe, 0));
        csv += `\n;;INGRESOS;${ingresos}\n;;EGRESOS;${egresos}\n;;TOTAL;${total}\n`;
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `QwenLIA_${active}${activeSub ? '_' + activeSub : ''}_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>
