<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QwenLIA Finanzas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1115; --surface: #1a1d24; --surface-hover: #252830;
      --primary: #3b82f6; --primary-hover: #2563eb;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
      --text: #e2e8f0; --text-muted: #94a3b8; --border: #334155;
      --radius: 10px; --shadow: 0 4px 12px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      min-height: 100vh; padding-bottom: 40px;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .logo span { color: var(--text-muted); font-weight: 400; font-size: 0.9rem; }
    .auth-box, .dashboard {
      background: var(--surface); padding: 20px;
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .hidden { display: none !important; }
    input, select, button {
      width: 100%; padding: 12px; margin-bottom: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; font-size: 14px;
      transition: all 0.2s;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button {
      cursor: pointer; font-weight: 600;
      background: var(--primary); color: white; border: none;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted);
    }
    button.secondary:hover { background: var(--surface-hover); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: #dc2626; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px; margin: 20px 0;
    }
    .card {
      background: var(--surface); padding: 15px;
      border-radius: var(--radius); text-align: center;
    }
    .card h3 { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .card p { font-size: 1.5rem; font-weight: 700; }
    .card.income p { color: var(--success); }
    .card.expense p { color: var(--danger); }
    .card.net p { color: var(--primary); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .controls button, .controls input, .controls select {
      width: auto; margin: 0; flex: 1; min-width: 120px;
    }
    .table-wrapper {
      overflow-x: auto; margin-top: 10px;
      border-radius: var(--radius); border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--surface-hover); color: var(--text-muted); font-weight: 600; cursor: pointer; }
    tr:hover { background: var(--surface-hover); }
    .actions { display: flex; gap: 8px; }
    .btn-icon { padding: 6px 8px; font-size: 14px; width: auto; }
    .subaccount-group { margin-bottom: 15px; }
    .group-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px; background: var(--surface-hover);
      cursor: pointer; border-radius: var(--radius) var(--radius) 0 0;
      border: 1px solid var(--border); border-bottom: none;
    }
    .group-content {
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .group-content.collapsed { display: none; }
    .status {
      font-size: 0.8rem; color: var(--text-muted);
      text-align: right; margin-bottom: 10px;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--success); color: white;
      padding: 12px 20px; border-radius: var(--radius);
      box-shadow: var(--shadow); transform: translateY(100px);
      transition: transform 0.3s; z-index: 1000;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { background: var(--danger); }
    @media (max-width: 768px) {
      .grid-2, .controls { grid-template-columns: 1fr; }
      .controls button { width: 100%; }
      .summary { grid-template-columns: 1fr; }
      table { font-size: 0.9rem; }
      th, td { padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">QwenLIA <span>Finanzas</span></div>
      <div id="user-info" class="hidden">
        <span id="user-email" style="margin-right: 10px; color: var(--text-muted);"></span>
        <button id="btn-logout" class="secondary btn-icon">Cerrar Sesión 🌗</button>
      </div>
    </header>

    <div id="auth-section" class="auth-box">
      <h2 style="margin-bottom: 15px; text-align: center;">Control financiero inteligente</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Correo electrónico" required>
        <input type="password" id="auth-password" placeholder="Contraseña (mín. 6 caracteres)" required minlength="6">
        <div class="grid-2">
          <button type="submit" id="btn-login">Iniciar Sesión</button>
          <button type="button" id="btn-signup" class="secondary">Crear Cuenta</button>
        </div>
        <p id="auth-msg" style="text-align: center; margin-top: 10px; font-size: 0.9rem; color: var(--warning); min-height: 1.2em;"></p>
      </form>
    </div>

    <div id="dashboard-section" class="dashboard hidden">
      <div class="status" id="sync-status">🔄 Conectando...</div>
      
      <div class="summary">
        <div class="card"><h3>SALDO TOTAL</h3><p id="saldo-total">$0.00</p></div>
        <div class="card income"><h3>INGRESOS</h3><p id="total-ingresos">$0.00</p></div>
        <div class="card expense"><h3>EGRESOS</h3><p id="total-egresos">$0.00</p></div>
        <div class="card net"><h3>NETO</h3><p id="neto">$0.00</p></div>
      </div>

      <form id="movement-form" style="margin-bottom: 20px;">
        <div class="grid-2">
          <input type="date" id="mv-fecha" required>
          <input type="text" id="mv-subcuenta" placeholder="Subcuenta (ej. Nómina)" required>
        </div>
        <div class="grid-2">
          <input type="text" id="mv-concepto" placeholder="Concepto" required>
          <input type="number" id="mv-monto" step="0.01" placeholder="Monto" required>
        </div>
        <select id="mv-tipo" required>
          <option value="ingreso">📈 Ingreso</option>
          <option value="egreso">📉 Egreso</option>
        </select>
        <button type="submit" id="btn-save-mv">💾 Guardar Movimiento</button>
        <button type="button" id="btn-cancel-edit" class="secondary hidden" style="margin-top: -10px; margin-bottom: 10px;">❌ Cancelar Edición</button>
      </form>

      <div class="controls">
        <input type="file" id="csv-import" accept=".csv" style="display: none;">
        <button id="btn-import" class="secondary">📂 Importar CSV</button>
        <button id="btn-export" class="secondary">📊 Exportar Excel</button>
        <button id="btn-sync" class="secondary">🔄 Forzar Sync</button>
      </div>

      <div id="movements-container"></div>
    </div>
  </div>

  <div id="toast" class="toast">Operación exitosa</div>

  <script>
    const SUPABASE_URL = 'https://nlyobscmahatxiiikafu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5seW9ic2NtYWhhdHhpaWlrYWZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMTk5OTksImV4cCI6MjA5MTc5NTk5OX0.9tbTFVk-hh1XckNRoq0RxmkpZ8I8jye7jtV5guT_kA4';
    
    // Inicializar cliente Supabase con nuevo nombre para evitar conflictos
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let movimientos = [];
    let editingId = null;
    let syncQueue = [];
    let isOnline = navigator.onLine;

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateSyncStatus(msg) {
      document.getElementById('sync-status').textContent = msg;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      if (dateStr.includes('-')) {
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }
      return dateStr;
    }

    function formatCurrency(amount) {
      return '$' + (amount || 0).toFixed(2);
    }

    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPass = document.getElementById('auth-password');
    const authMsg = document.getElementById('auth-msg');

    document.getElementById('btn-login').addEventListener('click', async (e) => {
      e.preventDefault();
      authMsg.textContent = '';
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: authEmail.value.trim(),
          password: authPass.value
        });
        if (error) throw error;
        if (data?.session) handleAuthSuccess(data.session);
      } catch (err) {
        authMsg.textContent = '❌ ' + err.message;
        showToast(err.message, true);
      }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      authMsg.textContent = '';
      if (authPass.value.length < 6) {
        authMsg.textContent = '❌ La contraseña debe tener al menos 6 caracteres';
        return;
      }
      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email: authEmail.value.trim(),
          password: authPass.value
        });
        if (error) throw error;
        if (data?.user) {
          authMsg.textContent = '✅ Cuenta creada. Revisa tu correo si es necesario.';
          showToast('Cuenta creada exitosamente');
        }
        if (data?.session) handleAuthSuccess(data.session);
      } catch (err) {
        authMsg.textContent = '❌ ' + err.message;
        showToast(err.message, true);
      }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });

    async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (session && !error) {
          handleAuthSuccess(session);
        } else {
          showAuth();
        }
      } catch (err) {
        console.error('Session check error:', err);
        showAuth();
      }
    }

    function handleAuthSuccess(session) {
      currentUser = session.user;
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('user-email').textContent = currentUser.email;
      loadMovements();
    }

    function showAuth() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('user-info').classList.add('hidden');
    }

    window.addEventListener('online', () => {
      isOnline = true;
      updateSyncStatus('🔄 Sincronizando...');
      syncQueueToSupabase();
    });
    
    window.addEventListener('offline', () => {
      isOnline = false;
      updateSyncStatus('📴 Modo Offline');
    });

    function saveToLocal() {
      try {
        localStorage.setItem('qwenlia_movimientos', JSON.stringify(movimientos));
      } catch (e) {
        console.warn('No se pudo guardar en localStorage:', e);
      }
    }

    function loadFromLocal() {
      try {
        const cached = localStorage.getItem('qwenlia_movimientos');
        if (cached) {
          movimientos = JSON.parse(cached);
          renderMovements();
          updateSummary();
        }
      } catch (e) {
        console.warn('No se pudo cargar desde localStorage:', e);
      }
    }

    async function syncQueueToSupabase() {
      if (!isOnline || !currentUser) return;
      
      if (syncQueue.length === 0) {
        updateSyncStatus('✅ Sincronizado');
        return;
      }
      
      updateSyncStatus('🔄 Sincronizando ' + syncQueue.length + ' cambios...');
      
      try {
        for (const item of syncQueue) {
          if (item.action === 'add') {
            const { error } = await supabaseClient.from('movimientos').insert([{
              user_id: currentUser.id,
              fecha: item.data.fecha,
              concepto: item.data.concepto,
              monto: item.data.monto,
              tipo: item.data.tipo,
              subcuenta: item.data.subcuenta
            }]);
            if (error) throw error;
          } else if (item.action === 'update') {
            const { error } = await supabaseClient.from('movimientos')
              .update({
                fecha: item.data.fecha,
                concepto: item.data.concepto,
                monto: item.data.monto,
                tipo: item.data.tipo,
                subcuenta: item.data.subcuenta
              })
              .eq('id', item.id);
            if (error) throw error;
          } else if (item.action === 'delete') {
            const { error } = await supabaseClient.from('movimientos')
              .delete()
              .eq('id', item.id);
            if (error) throw error;
          }
        }
        syncQueue = [];
        await loadFromSupabase();
        updateSyncStatus('✅ Sincronizado');
      } catch (err) {
        console.error('Sync error:', err);
        updateSyncStatus('⚠️ Error de sync. Reintentando...');
      }
    }

    async function loadMovements() {
      if (isOnline) {
        await loadFromSupabase();
      } else {
        loadFromLocal();
        updateSyncStatus('📴 Cargando desde caché');
      }
    }

    async function loadFromSupabase() {
      try {
        updateSyncStatus('🔄 Descargando datos...');
        
        const { data, error } = await supabaseClient
          .from('movimientos')
          .select('*')
          .order('fecha', { ascending: false });
        
        if (error) throw error;
        
        movimientos = data || [];
        saveToLocal();
        renderMovements();
        updateSummary();
        updateSyncStatus('✅ Sincronizado');
      } catch (err) {
        console.error('Fetch error:', err);
        loadFromLocal();
        updateSyncStatus('⚠️ Error de red. Usando caché local.');
      }
    }

    document.getElementById('btn-sync').addEventListener('click', () => {
      if (isOnline) {
        syncQueueToSupabase();
      } else {
        showToast('Sin conexión. Activa internet para sincronizar.', true);
      }
    });

    document.getElementById('movement-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fecha = document.getElementById('mv-fecha').value;
      const concepto = document.getElementById('mv-concepto').value.trim();
      const monto = parseFloat(document.getElementById('mv-monto').value);
      const tipo = document.getElementById('mv-tipo').value;
      const subcuenta = document.getElementById('mv-subcuenta').value.trim();

      if (!fecha || !concepto || isNaN(monto)) {
        showToast('Por favor completa todos los campos', true);
        return;
      }

      const payload = { fecha, concepto, monto, tipo, subcuenta };

      if (editingId) {
        movimientos = movimientos.map(m => 
          m.id === editingId ? { ...m, ...payload } : m
        );
        syncQueue.push({ action: 'update', id: editingId, data: payload });
        editingId = null;
        document.getElementById('btn-cancel-edit').classList.add('hidden');
        document.getElementById('btn-save-mv').textContent = '💾 Guardar Movimiento';
      } else {
        const tempId = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const newMov = {
          id: tempId,
          user_id: currentUser?.id || 'unknown',
          ...payload,
          created_at: new Date().toISOString()
        };
        movimientos.unshift(newMov);
        syncQueue.push({ action: 'add', data: payload });
      }

      saveToLocal();
      renderMovements();
      updateSummary();
      e.target.reset();
      document.getElementById('mv-fecha').value = new Date().toISOString().split('T')[0];
      
      if (isOnline) syncQueueToSupabase();
      showToast('Movimiento registrado');
    });

    window.editMovement = function(id) {
      const mv = movimientos.find(m => m.id === id);
      if (!mv) return;
      
      editingId = id;
      document.getElementById('mv-fecha').value = mv.fecha;
      document.getElementById('mv-concepto').value = mv.concepto;
      document.getElementById('mv-monto').value = mv.monto;
      document.getElementById('mv-tipo').value = mv.tipo;
      document.getElementById('mv-subcuenta').value = mv.subcuenta;
      
      document.getElementById('btn-save-mv').textContent = '✏️ Actualizar';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('btn-cancel-edit').addEventListener('click', () => {
      editingId = null;
      document.getElementById('movement-form').reset();
      document.getElementById('btn-save-mv').textContent = '💾 Guardar Movimiento';
      document.getElementById('btn-cancel-edit').classList.add('hidden');
      document.getElementById('mv-fecha').value = new Date().toISOString().split('T')[0];
    });

    window.deleteMovement = async function(id) {
      if (!confirm('¿Eliminar este movimiento permanentemente?')) return;
      
      movimientos = movimientos.filter(m => m.id !== id);
      syncQueue.push({ action: 'delete', id });
      
      saveToLocal();
      renderMovements();
      updateSummary();
      
      if (isOnline) syncQueueToSupabase();
      showToast('Movimiento eliminado');
    };

    function renderMovements() {
      const container = document.getElementById('movements-container');
      container.innerHTML = '';
      
      if (movimientos.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 20px; color: var(--text-muted);">No hay movimientos registrados.</p>';
        return;
      }

      const groups = {};
      movimientos.forEach(m => {
        const key = m.subcuenta || 'Sin categoría';
        if (!groups[key]) groups[key] = [];
        groups[key].push(m);
      });

      Object.keys(groups).sort().forEach(sub => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'subaccount-group';
        
        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `<span>📂 ${sub} <small style="color:var(--text-muted)">(${groups[sub].length})</small></span>`;
        
        const content = document.createElement('div');
        content.className = 'group-content';
        
        header.addEventListener('click', () => content.classList.toggle('collapsed'));
        
        const table = document.createElement('div');
        table.className = 'table-wrapper';
        table.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Concepto</th>
                <th>Monto</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${groups[sub].map(m => `
                <tr>
                  <td>${formatDate(m.fecha)}</td>
                  <td>${m.concepto}</td>
                  <td style="color: ${m.tipo === 'ingreso' ? 'var(--success)' : 'var(--danger)'}; font-weight:600;">
                    ${m.tipo === 'ingreso' ? '+' : '-'}${formatCurrency(m.monto)}
                  </td>
                  <td class="actions">
                    <button class="btn-icon secondary" onclick="editMovement('${m.id}')">✏️</button>
                    <button class="btn-icon danger" onclick="deleteMovement('${m.id}')">🗑️</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        
        content.appendChild(table);
        groupDiv.appendChild(header);
        groupDiv.appendChild(content);
        container.appendChild(groupDiv);
      });
    }

    function updateSummary() {
      const ingresos = movimientos
        .filter(m => m.tipo === 'ingreso')
        .reduce((a, b) => a + (parseFloat(b.monto) || 0), 0);
      
      const egresos = movimientos
        .filter(m => m.tipo === 'egreso')
        .reduce((a, b) => a + (parseFloat(b.monto) || 0), 0);
      
      const saldo = ingresos - egresos;
      
      document.getElementById('total-ingresos').textContent = formatCurrency(ingresos);
      document.getElementById('total-egresos').textContent = formatCurrency(egresos);
      document.getElementById('saldo-total').textContent = formatCurrency(saldo);
      document.getElementById('neto').textContent = formatCurrency(saldo);
    }

    document.getElementById('btn-import').addEventListener('click', () => {
      document.getElementById('csv-import').click();
    });

    document.getElementById('csv-import').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      try {
        const text = await file.text();
        const lines = text.trim().split(/\r?\n/);
        let added = 0;
        
        lines.forEach(line => {
          const row = line.split(/[;,]/);
          if (row.length < 3) return;
          
          const [fechaRaw, concepto, montoRaw, tipoRaw = 'egreso', subcuentaRaw = 'Importado'] = row;
          const monto = parseFloat(montoRaw.replace(/[^0-9.-]/g, ''));
          if (isNaN(monto)) return;
          
          let fecha = fechaRaw.trim();
          if (fecha.includes('/')) {
            const [d, m, y] = fecha.split('/');
            fecha = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
          }
          
          const tempId = 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
          const tipo = tipoRaw.toLowerCase().includes('ing') ? 'ingreso' : 'egreso';
          
          movimientos.unshift({
            id: tempId,
            user_id: currentUser?.id || 'unknown',
            fecha,
            concepto: concepto.trim(),
            monto,
            tipo,
            subcuenta: subcuentaRaw.trim(),
            created_at: new Date().toISOString()
          });
          
          syncQueue.push({
            action: 'add',
            data: { fecha, concepto: concepto.trim(), monto, tipo, subcuenta: subcuentaRaw.trim() }
          });
          added++;
        });
        
        saveToLocal();
        renderMovements();
        updateSummary();
        if (isOnline) syncQueueToSupabase();
        showToast(`✅ ${added} movimientos importados`);
      } catch (err) {
        showToast('Error al importar CSV', true);
      }
      e.target.value = '';
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      if (movimientos.length === 0) {
        showToast('⚠️ No hay datos para exportar', true);
        return;
      }
      const bom = '\uFEFF';
      const sep = ';';
      const header = ['Fecha', 'Concepto', 'Monto', 'Tipo', 'Subcuenta'].join(sep);
      const rows = movimientos.map(m => [
        m.fecha,
        `"${(m.concepto || '').replace(/"/g, '""')}"`,
        (m.monto || 0).toFixed(2),
        m.tipo,
        `"${(m.subcuenta || '').replace(/"/g, '""')}"`
      ].join(sep));
      const csvContent = bom + header + '\n' + rows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Export_Finanzas_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('mv-fecha').value = new Date().toISOString().split('T')[0];
      checkSession();
    });
  </script>
</body>
</html>
